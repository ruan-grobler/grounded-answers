      quote: charged a no-show fee of R500, or R900 for appointments of 90 minutes or longer
  a04:
    - statement: The spore test (a biological indicator) is run weekly, every Monday, in the first loaded cycle of the day.
      doc: sterilisation-cycle-checklist
