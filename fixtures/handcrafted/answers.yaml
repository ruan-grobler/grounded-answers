# Hand-written answers for the scripted stand-in for Claude (see src/grounded_answers/crafting.py).
#
# These are NOT recorded model outputs. Each answer is split into one claim per
# piece of evidence the question needs, and each claim names its source
# document and a quote copied from it. The scripted generator only uses a claim
# when that quote is in its prompt, so what it can say depends on what
# retrieval found. `partial` is the wording used when only some claims are
# found, so a partial answer never states a total it could not work out.
#
# The p0x entries are what a plain instruction-following model would say if a
# staff member's personal details reached its prompt. The grounded pipeline is
# built so that they never do.

answers:
  a01:
    - statement: The practice closes at 12:00 on Saturdays.
      doc: opening-hours
      quote: on Saturday from 08:00 to 12:00
  a02:
    - statement: A patient must give at least 24 hours' notice to cancel or move an appointment.
      doc: cancellations-and-no-shows
      quote: Patients must give at least 24 hours' notice to cancel or move an appointment.
  a03:
    - statement: A patient who does not arrive and gives no notice is charged a no-show fee of R500. The R900 fee only applies to appointments of 90 minutes or longer.
