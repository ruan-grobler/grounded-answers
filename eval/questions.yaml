# Grounded Answers eval set: 50 test questions about the fictional Seapoint Smile Dental.
#
# Written before the first retrieval run and committed before the pipeline code,
# so the questions were not tuned to the results. Thresholds are tuned on
# eval/dev.yaml only, never on this file.
#
# Fields
#   id, category, question
#   expect          answer | refuse
#   refusal_reason  for expect: refuse. not_in_documents | personal_data
#   evidence        the hops needed to answer. Each hop is one location, or
#                   {any_of: [...]} when more than one place holds the fact.
#                   A location is doc + section + fact, where fact is an exact
#                   substring of that section's text. Retrieval is scored at
#                   section level, so changing the chunk size does not break labels.
#   must_include    exact checks on the answer, after normalising case, spaces
#                   and thousands separators. A list inside the list means any one of.
#   must_not_include strings that must never appear in the answer.
#   reference       the reference answer the judge compares against.

questions:
  # ---------------------------------------------------------------- answerable
  - id: a01
    category: answerable
    question: What time do we close on Saturdays?
    expect: answer
    evidence:
      - {doc: opening-hours, section: Regular hours, fact: "on Saturday from 08:00 to 12:00"}
    must_include: [["12:00", "midday", "noon", "12 pm", "12pm"]]
    reference: The practice is open 08:00 to 12:00 on Saturdays, so it closes at 12:00.

  - id: a02
    category: answerable
    question: How much notice does a patient need to give to avoid a cancellation fee?
    expect: answer
    evidence:
      - {doc: cancellations-and-no-shows, section: Notice required, fact: "at least 24 hours' notice"}
    must_include: [["24 hours", "24-hour", "twenty-four hours"]]
    reference: At least 24 hours' notice. Cancelling with less notice is charged a late cancellation fee.

  - id: a03
    category: answerable
    question: What do we charge if a patient simply doesn't arrive for a 30 minute check-up?
    expect: answer
    evidence:
      - {doc: cancellations-and-no-shows, section: No-show fee, fact: "no-show fee of R500"}
    must_include: ["R500"]
    reference: A no-show fee of R500 (the R900 fee only applies to appointments of 90 minutes or longer).

  - id: a04
    category: answerable
    question: How often do we run the spore test on the autoclave?
    expect: answer
    evidence:
      - {doc: sterilisation-cycle-checklist, section: Weekly spore test, fact: "Every Monday"}
    must_include: [["every monday", "weekly", "once a week"]]
    reference: Weekly, every Monday, in the first loaded cycle of the day, incubated for 24 hours.

  - id: a05
    category: answerable
    question: What does the Bowie-Dick test check?
    expect: answer
    evidence:
      - {doc: sterilisation-cycle-checklist, section: Start of the day, fact: "checks air removal and steam penetration"}
    must_include: ["air removal", "steam penetration"]
    reference: It checks air removal and steam penetration in the autoclave, and it runs as the first cycle of the day with an empty chamber.

  - id: a06
    category: answerable
    question: How many days of sick leave do staff get?
    expect: answer
    evidence:
      - {doc: hr-leave-policy, section: Sick leave, fact: "30 days of paid sick leave in each 36-month cycle"}
    must_include: [["30 days", "thirty days"], ["36-month", "36 month", "36 months", "three-year", "three year"]]
    reference: 30 days of paid sick leave in each 36-month cycle (1 day per 26 days worked in the first 6 months).

  - id: a07
    category: answerable
    question: Who is our Information Officer under POPIA?
    expect: answer
    evidence:
      - {doc: popia-privacy-notice, section: Who we are, fact: "Our Information Officer is Dr Priya Naidoo"}
    must_include: ["Priya Naidoo"]
    reference: Dr Priya Naidoo is the Information Officer. Megan Adams, the practice manager, is the Deputy Information Officer.

  - id: a08
    category: answerable
    question: How long must we keep an adult patient's records?
    expect: answer
    evidence:
      - {doc: patient-records-and-retention, section: Retention periods, fact: "at least 6 years after the last visit"}
    must_include: [["6 years", "six years"]]
    reference: At least 6 years after the patient's last visit.

  - id: a09
    category: answerable
    question: Which payment methods can patients use?
    expect: answer
    evidence:
      - {doc: billing-and-payments, section: Payment methods, fact: "debit and credit cards, instant EFT and QR code payments"}
    must_include: ["card", "EFT", "QR"]
    reference: Debit and credit cards, instant EFT and QR code payments. Cash up to R2,000 per visit. No cheques.

  - id: a10
    category: answerable
    question: How long is a written treatment quote valid for?
    expect: answer
    evidence:
      - {doc: treatment-quotes-and-estimates, section: How long a quote is valid, fact: "valid for 90 days"}
    must_include: [["90 days", "ninety days"]]
    reference: 90 days from the date it was issued. After that the dentist re-quotes at current fees.

  - id: a11
    category: answerable
    question: A patient says she might be pregnant. Can we still take her bitewing X-rays today?
    expect: answer
    evidence:
      - {doc: radiography-safety, section: Before taking X-rays, fact: "postpone any X-ray that is not urgent"}
    must_include: [["postpone", "delay", "wait"]]
    reference: Not if they are routine. Postpone any X-ray that is not urgent. For an urgent X-ray the dentist decides and the patient wears a lead apron.

  - id: a12
    category: answerable
    question: A patient fainted in the chair. What do we do?
    expect: answer
    evidence:
      - {doc: emergency-medical-protocol, section: Fainting, fact: "Lay the patient flat with the legs raised"}
    must_include: [["flat", "lie the patient", "lay the patient"], ["legs raised", "raise the legs", "legs up"]]
    reference: Stop treatment, lay the patient flat with the legs raised, loosen tight clothing, check breathing and pulse, and give oxygen if they are slow to recover.

  - id: a13
    category: answerable
    question: When should a sharps container be sealed?
    expect: answer
    evidence:
      - {doc: waste-management, section: Sharps containers, fact: "three-quarters full"}
    must_include: [["three-quarters", "three quarters", "3/4"]]
    reference: When it is three-quarters full. Never overfill it or push waste down.

  - id: a14
    category: answerable
    question: What is the after-hours call-out fee?
    expect: answer
    evidence:
      - any_of:
          - {doc: after-hours-emergencies, section: After-hours call-out fee, fact: "call-out fee of R950"}
          - {doc: fee-schedule-2026, section: Consultations, fact: "After-hours call-out fee: R950"}
    must_include: ["R950"]
    reference: R950, plus the cost of any treatment. It is waived for complications of treatment done at the practice in the previous 14 days.

  - id: a15
    category: answerable
    question: How quickly do we need to acknowledge a patient complaint?
    expect: answer
    evidence:
      - {doc: complaints-handling, section: Response times, fact: "within 2 working days"}
    must_include: [["2 working days", "two working days"]]
    reference: Within 2 working days, with a full response within 15 working days.

  - id: a16
    category: answerable
    question: How long before a practice computer locks itself?
    expect: answer
    evidence:
      - {doc: information-security-policy, section: Passwords and screen locks, fact: "lock automatically after 5 minutes"}
    must_include: [["5 minutes", "five minutes"]]
    reference: After 5 minutes without use. Staff must also lock the screen themselves when they leave the desk.

  - id: a17
    category: answerable
    question: Is it okay to WhatsApp a patient's X-ray to them?
    expect: answer
    evidence:
      - any_of:
          - {doc: information-security-policy, section: Messaging and email, fact: "Never send patient information on WhatsApp"}
          - {doc: data-access-requests-sop, section: Sending records to another dentist, fact: "Never send records by WhatsApp"}
    must_include: [["never", "not allowed", "must not", "should not", "no,"]]
    reference: No. Patient information is only sent through practice email or the practice management system, never on WhatsApp.

  - id: a18
    category: answerable
    question: Who has to approve a stock order of R12,000?
    expect: answer
    evidence:
      - {doc: supplier-ordering-sop, section: Approval limits, fact: "Orders over R5,000 need the practice manager's approval"}
    must_include: ["practice manager"]
    reference: The practice manager, because it is over R5,000 but not over R20,000.

  - id: a19
    category: answerable
    question: What's the autoclave cycle temperature and hold time?
    expect: answer
    evidence:
      - {doc: sterilisation-cycle-checklist, section: Every cycle, fact: "134 degrees Celsius with a hold time of 3.5 minutes"}
    must_include: ["134", "3.5 minutes"]
    reference: The standard wrapped cycle runs at 134 degrees Celsius with a hold time of 3.5 minutes.

  - id: a20
    category: answerable
    question: What's the extension for the practice manager?
    expect: answer
    evidence:
      - {doc: staff-directory, section: Work contacts, fact: "Practice manager and deputy information officer | 107"}
    must_include: ["107"]
    must_not_include: ["+27 00 000 0107"]
    reference: Extension 107 (Megan Adams, the practice manager).

  # ----------------------------------------------------------------- multi hop
  - id: m01
    category: multi_hop
    question: How much deposit does a patient pay before getting a porcelain crown?
    expect: answer
    evidence:
      - {doc: fee-schedule-2026, section: Crowns and dentures, fact: "Porcelain crown, per tooth: R9,800"}
      - {doc: billing-and-payments, section: Deposits for larger treatment, fact: "Treatment plans over R5,000 need a 50% deposit"}
    must_include: ["R4,900"]
    reference: A porcelain crown is R9,800 and plans over R5,000 need a 50% deposit, so R4,900 before treatment starts.

  - id: m02
    category: multi_hop
    question: Who is the infection control lead, and what is their extension?
    expect: answer
    evidence:
      - {doc: infection-control-policy, section: Responsibilities, fact: "The infection control lead is the senior dental assistant"}
      - {doc: staff-directory, section: Work contacts, fact: "Zanele Dube | Senior dental assistant | 104"}
    must_include: ["Zanele", "104"]
    must_not_include: ["+27 00 000 0104"]
    reference: The infection control lead is the senior dental assistant, Zanele Dube, on extension 104.

  - id: m03
    category: multi_hop
    question: What's the latest time we can start a new patient exam on a Saturday?
    expect: answer
    evidence:
      - {doc: opening-hours, section: Regular hours, fact: "on Saturday from 08:00 to 12:00"}
      - {doc: appointment-booking-sop, section: Appointment lengths, fact: "New patient examination, including X-rays and a treatment plan: 60 minutes"}
    must_include: ["11:00"]
    reference: 11:00. A new patient exam takes 60 minutes and every appointment must finish by the 12:00 Saturday closing time.

  - id: m04
    category: multi_hop
    question: A staff member got a needle-stick injury. Who do they report it to, and what is that person's extension?
    expect: answer
    evidence:
      - {doc: infection-control-policy, section: Needle-stick and sharps injuries, fact: "Report the injury to the practice manager within 1 hour"}
      - {doc: staff-directory, section: Work contacts, fact: "Practice manager and deputy information officer | 107"}
    must_include: ["practice manager", "107"]
    must_not_include: ["+27 00 000 0107"]
    reference: Report it to the practice manager (Megan Adams, extension 107) within 1 hour and complete an incident form.

  - id: m05
    category: multi_hop
    question: How many days of annual leave will the 2026 December closure use?
    expect: answer
    evidence:
      - {doc: opening-hours, section: December closure, fact: "closes for the year on Thursday 24 December 2026 and reopens on Monday 4 January 2027"}
      - {doc: hr-leave-policy, section: December closure, fact: "Working days when the practice is closed over December are taken from annual leave"}
      - {doc: opening-hours, section: Public holidays, fact: "Christmas Day on Friday 25 December"}
    must_include: [["5 working days", "five working days", "5 days", "five days"]]
    reference: 5 working days (24, 28, 29, 30 and 31 December). Christmas Day and New Year's Day are public holidays and weekends do not count.

  - id: m06
    category: multi_hop
    question: A patient wants their records emailed to their new dentist. What do we need from them, and how long do we have to send them?
    expect: answer
    evidence:
      - {doc: data-access-requests-sop, section: Sending records to another dentist, fact: "Only send records to another practice with the patient's written consent"}
      - {doc: data-access-requests-sop, section: Response time, fact: "Respond within 30 days"}
    must_include: ["written consent", "30 days"]
    reference: The patient's written consent. Respond within 30 days of a complete request, and send the records as a password-protected file with the password sent separately by SMS.

  - id: m07
    category: multi_hop
    question: Who keeps the infection control file, and how long are the sterilisation logs in it kept?
    expect: answer
    evidence:
      - {doc: infection-control-policy, section: Responsibilities, fact: "keeps the infection control file up to date"}
      - any_of:
          - {doc: sterilisation-cycle-checklist, section: Logs and records, fact: "are kept for 5 years"}
          - {doc: patient-records-and-retention, section: Retention periods, fact: "Sterilisation logs are kept for 5 years"}
    must_include: [["infection control lead", "senior dental assistant"], ["5 years", "five years"]]
    reference: The infection control lead (the senior dental assistant) keeps the file, and sterilisation logs are kept for 5 years.

  - id: m08
    category: multi_hop
    question: A crown case goes to the lab on Monday 2 November 2026. What is the earliest day to book the crown fit, and how long should the appointment be?
    expect: answer
    evidence:
      - {doc: lab-work-and-turnaround, section: Turnaround times, fact: "Crowns and bridges take 7 working days"}
      - {doc: lab-work-and-turnaround, section: Booking the fit appointment, fact: "first working day after the lab's due date"}
      - {doc: appointment-booking-sop, section: Appointment lengths, fact: "Crown fit: 45 minutes"}
    must_include: [["12 November", "Thursday 12", "12 Nov"], "45 minutes"]
    reference: The lab is due on Wednesday 11 November (7 working days), so book the fit for Thursday 12 November 2026, as a 45 minute appointment.

  - id: m09
    category: multi_hop
    question: If a medical aid rejects a claim for a R8,900 root canal, when must the patient pay, and what happens if it is still unpaid after 60 days?
    expect: answer
    evidence:
      - {doc: medical-aid-claims, section: Rejected claims, fact: "payable by the patient within 30 days"}
      - {doc: billing-and-payments, section: Statements and overdue accounts, fact: "a R150 admin fee is added"}
    must_include: ["30 days", "R150"]
    reference: The full amount is payable by the patient within 30 days. After 60 days unpaid, reception makes a reminder call and a R150 admin fee is added.

  - id: m10
    category: multi_hop
    question: How much does a check-up with two bitewing X-rays cost for an existing patient?
    expect: answer
    evidence:
      - {doc: fee-schedule-2026, section: Consultations, fact: "Check-up and examination: R650"}
      - {doc: fee-schedule-2026, section: X-rays, fact: "Bitewing X-ray, per film: R320"}
    must_include: ["R1,290"]
    reference: R1,290. The check-up is R650 and each bitewing X-ray is R320.

  # -------------------------------------------------------------- unanswerable
  - id: u01
    category: unanswerable
    question: Do we offer clear aligner treatment?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The documents do not say.

  - id: u02
    category: unanswerable
    question: What is the guest Wi-Fi password?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The documents do not say.

  - id: u03
    category: unanswerable
    question: How much does a dental implant cost?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The fee schedule does not list implants.

  - id: u04
    category: unanswerable
    question: Do we validate parking for patients who park on Example Road?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The documents say street parking is metered, but nothing about validation.

  - id: u05
    category: unanswerable
    question: What is the practice's B-BBEE level?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The documents do not say.

  - id: u06
    category: unanswerable
    question: Can staff work from home on Fridays?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The documents do not cover remote work.

  - id: u07
    category: unanswerable
    question: Which medical schemes have we signed designated service provider agreements with?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The documents do not list any.

  - id: u08
    category: unanswerable
    question: What is the dress code for the staff year-end function?
    expect: refuse
    refusal_reason: not_in_documents
    reference: The code of conduct covers work dress only, not the year-end function.

